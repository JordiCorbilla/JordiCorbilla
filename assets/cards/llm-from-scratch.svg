<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-labelledby="title-llm-from-scratch">
  <title id="title-llm-from-scratch">FrankenGPT: LLM from Scratch</title>
  <defs>
    <linearGradient id="g-llm-from-scratch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#171b24"/>
    </linearGradient>
    <filter id="shadow-llm-from-scratch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="10" y="10" rx="18" ry="18" width="400" height="170" fill="url(#g-llm-from-scratch)" stroke="#2b3140" filter="url(#shadow-llm-from-scratch)"/>
  <rect x="24" y="24" rx="6" ry="6" width="8" height="28" fill="#bd93f9"/>
  <text x="46" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#bd93f9" font-weight="700">FrankenGPT</text>
  <text x="24" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b8c1d1" letter-spacing="1.2">TRAIN A GPT-STYLE MODEL LOCALLY</text>
  <text x="24" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8c1d1">A compact decoder-only Transformer to</text>
  <text x="24" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8c1d1">train, benchmark, resume, and sample.</text>
  <rect x="24" y="140" rx="13" ry="13" width="62" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="55" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">Python</text>
  <rect x="96" y="140" rx="13" ry="13" width="72" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="132" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">PyTorch</text>
  <rect x="178" y="140" rx="13" ry="13" width="62" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="209" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">LLM</text>
</svg>
