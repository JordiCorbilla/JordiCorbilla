<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-labelledby="title-react-forge-kit">
  <title id="title-react-forge-kit">React Forge Kit</title>
  <defs>
    <linearGradient id="g-react-forge-kit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f29"/>
      <stop offset="100%" stop-color="#171b24"/>
    </linearGradient>
    <filter id="shadow-react-forge-kit" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="10" y="10" rx="18" ry="18" width="400" height="170" fill="url(#g-react-forge-kit)" stroke="#2b3140" filter="url(#shadow-react-forge-kit)"/>
  <rect x="24" y="24" rx="6" ry="6" width="8" height="28" fill="#8be9fd"/>
  <text x="46" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#8be9fd" font-weight="700">React Forge Kit</text>
  <text x="24" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b8c1d1" letter-spacing="1.2">EXAMPLE-DRIVEN REACT TOOLKIT</text>
  <text x="24" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8c1d1">Copy-ready patterns for data, state, grids,</text>
  <text x="24" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#b8c1d1">jobs, realtime events, and API boundaries.</text>
  <rect x="24" y="140" rx="13" ry="13" width="62" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="55" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">React</text>
  <rect x="96" y="140" rx="13" ry="13" width="86" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="139" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">TypeScript</text>
  <rect x="192" y="140" rx="13" ry="13" width="72" height="28" fill="#252b38" stroke="#2b3140"/>
  <text x="228" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f8f8f2" font-weight="600">AG Grid</text>
</svg>
